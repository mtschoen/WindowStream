<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WindowStream latency clock</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Cascadia Mono', 'Consolas', 'Menlo', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    gap: 4vh;
  }
  #clock {
    font-size: 20vh;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  #sweep {
    position: relative;
    width: 90vw;
    height: 7vh;
    background: #111;
    border: 1px solid #444;
  }
  #ticks div {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #555;
  }
  #ticks div.major {
    background: #aaa;
    width: 2px;
  }
  #marker {
    position: absolute;
    top: -8%;
    height: 116%;
    width: 0.5vw;
    min-width: 4px;
    background: #fff;
    box-shadow: 0 0 6px #fff;
    will-change: transform;
  }
  #legend {
    color: #999;
    font-size: 1.6vh;
    letter-spacing: 0.18em;
  }
  #diagnostics {
    color: #aaa;
    font-size: 3vh;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  #frame-container {
    color: #888;
    font-size: 8vh;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  #frame-count {
    color: #0f0;
    font-size: 15vh;
    font-weight: bold;
    text-shadow: 0 0 16px rgba(0, 255, 0, 0.4);
  }
</style>
</head>
<body>
  <div id="clock">--:--:--.---</div>
  <div id="frame-container">
    FRAME: <span id="frame-count">0</span>
  </div>
  <div id="sweep">
    <div id="ticks"></div>
    <div id="marker"></div>
  </div>
  <div id="legend">SWEEP WRAPS EVERY 1000 ms &middot; MAJOR TICK = 100 ms</div>
  <div id="diagnostics">
    RENDER: <span id="actual-fps">0.0</span> FPS (<span id="actual-interval">0.0</span> ms)
  </div>
  <script>
    const clock = document.getElementById('clock');
    const marker = document.getElementById('marker');
    const sweep = document.getElementById('sweep');
    const ticksContainer = document.getElementById('ticks');
    const frameCountEl = document.getElementById('frame-count');
    const actualFpsEl = document.getElementById('actual-fps');
    const actualIntervalEl = document.getElementById('actual-interval');

    // Optional ?cap=N query param: rate-limit DOM updates to ~N fps using a
    // time-quantized RAF (RAF runs every vsync, repaint only when interval
    // elapsed; remainder carries forward to prevent drift). Default = native
    // monitor refresh.
    const capFps = parseInt(new URLSearchParams(location.search).get('cap'), 10);
    const targetInterval = capFps > 0 ? (1000 / capFps) : 0;
    if (capFps > 0) {
      document.title = `WindowStream latency clock (${capFps}fps cap)`;
    }

    for (let i = 0; i <= 100; i++) {
      const tick = document.createElement('div');
      tick.style.left = i + '%';
      if (i % 10 === 0) tick.className = 'major';
      ticksContainer.appendChild(tick);
    }

    let travelPx = 0;
    const recomputeTravel = () => {
      travelPx = sweep.clientWidth - marker.clientWidth;
    };
    recomputeTravel();
    window.addEventListener('resize', recomputeTravel);

    const pad = (n, w) => String(n).padStart(w, '0');

    let lastDraw = 0;
    let frameCount = 0;
    let lastFrameTime = performance.now();
    const fpsHistory = [];
    const maxHistory = 60;

    function update(now) {
      if (targetInterval === 0 || now - lastDraw >= targetInterval) {
        const d = new Date();
        const ms = d.getMilliseconds();
        clock.textContent =
          pad(d.getHours(), 2) + ':' +
          pad(d.getMinutes(), 2) + ':' +
          pad(d.getSeconds(), 2) + '.' +
          pad(ms, 3);
        marker.style.transform = `translateX(${(ms / 1000) * travelPx}px)`;
        lastDraw = targetInterval === 0
          ? now
          : (lastDraw === 0 ? now : lastDraw + targetInterval);

        frameCount++;
        const frameTime = performance.now();
        const delta = frameTime - lastFrameTime;
        lastFrameTime = frameTime;

        if (delta > 0) {
          fpsHistory.push(delta);
          if (fpsHistory.length > maxHistory) fpsHistory.shift();
          const avgDelta = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;
          const avgFps = 1000 / avgDelta;

          frameCountEl.textContent = frameCount;
          actualFpsEl.textContent = avgFps.toFixed(1);
          actualIntervalEl.textContent = avgDelta.toFixed(1);
        } else {
          frameCountEl.textContent = frameCount;
        }
      }
      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  </script>
</body>
</html>
