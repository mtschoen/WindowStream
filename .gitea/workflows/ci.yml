name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      WINDOWSTREAM_SKIP_NVENC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x
      - uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: windows-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: windows-nuget-
      - name: Restore
        shell: pwsh
        run: dotnet restore
      - name: Build
        shell: pwsh
        run: dotnet build -c Release --no-restore
      - name: Test (unit + server, skip integration)
        shell: pwsh
        run: |
          dotnet test tests/WindowStream.Core.Tests/WindowStream.Core.Tests.csproj -c Release --no-build -v normal
          dotnet test tests/WindowStream.Server.Tests/WindowStream.Server.Tests.csproj -c Release --no-build -v normal
      - name: Post coverage status
        if: always()
        shell: pwsh
        # Parse Cobertura natively in PowerShell: the Windows runner has no
        # python/python3/py (see local-ci project-ci-setup.md). Merges across
        # test projects at the line level (covered if any report hits it),
        # matching ci/coverage-percent.py used by the Linux repos.
        run: |
          $state = "error"; $desc = "coverage measurement failed"
          try {
            $files = Get-ChildItem -Path tests -Recurse -Filter coverage.cobertura.xml |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }
            if (-not $files) { throw "no Cobertura XML matched" }
            $lines = @{}
            foreach ($file in $files) {
              [xml]$report = Get-Content -LiteralPath $file.FullName
              foreach ($class in $report.SelectNodes('//class')) {
                $filename = $class.filename
                foreach ($line in $class.SelectNodes('.//line')) {
                  $key = "${filename}:$($line.number)"
                  $hit = ([int]$line.hits) -gt 0
                  if ($lines.ContainsKey($key)) { $lines[$key] = $lines[$key] -or $hit }
                  else { $lines[$key] = $hit }
                }
              }
            }
            $total = $lines.Count
            if ($total -eq 0) { throw "no source lines in Cobertura XML" }
            $covered = ($lines.Values | Where-Object { $_ }).Count
            $invariant = [System.Globalization.CultureInfo]::InvariantCulture
            $pct = ([math]::Round(100.0 * $covered / $total, 2)).ToString($invariant)
            $state = "success"; $desc = "$pct% line coverage"
          } catch {
            Write-Host "coverage parse failed: $_"
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ context = "pr-crew/coverage"; state = $state; description = $desc; target_url = $runUrl } | ConvertTo-Json -Compress
          Write-Host "posting status: $body"
          curl.exe -sk -X POST `
            -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Content-Type: application/json" `
            -d $body `
            "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lint-markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markdownlint
        run: npx -y markdownlint-cli '**/*.md' --ignore node_modules